<VirtualHost *:443>
    ServerName sforms.serenaesteve.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/sforms.serenaesteve.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sforms.serenaesteve.com/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    # La aplicación toma la IP real de X-Forwarded-For (la añade mod_proxy)
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8106/
    ProxyPassReverse / http://127.0.0.1:8106/
    ProxyTimeout 60
    LimitRequestBody 524288

    CustomLog ${APACHE_LOG_DIR}/sforms-ssl-access.log combined
    ErrorLog ${APACHE_LOG_DIR}/sforms-ssl-error.log
</VirtualHost>
